<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" role="img" aria-labelledby="t d"><title id="t">Computational graph</title><desc id="d">A simple directed computation graph: x and w feed multiplication, then addition with b, then an activation.</desc><rect width="480" height="300" fill="#eee6d7"/><g fill="none" stroke="#5a5349" stroke-width="2"><path d="M92 99 180 135M92 202 180 155M219 145 294 145M332 145 393 145"/><path d="m172 130 9 5-9 5m0 13 9 5-9 5m105-18 9 5-9 5m55-5 9 5-9 5"/></g><g fill="#f5eedf" stroke="#514a40" stroke-width="2"><circle cx="79" cy="94" r="27"/><circle cx="79" cy="206" r="27"/><circle cx="199" cy="145" r="25"/><circle cx="319" cy="145" r="25"/><circle cx="414" cy="145" r="27"/></g><g fill="#574f45" text-anchor="middle" font-family="Georgia,serif" font-size="16"><text x="79" y="99">x, w</text><text x="79" y="211">b</text><text x="199" y="151">×</text><text x="319" y="151">+</text><text x="414" y="151">σ</text></g><g fill="#766b5b" font-family="Georgia,serif" font-size="13" font-style="italic"><text x="170" y="202">multiply</text><text x="291" y="202">add bias</text><text x="367" y="199">activation</text></g><path d="M52 256c103-6 243 5 371-2" fill="none" stroke="#8b5553" stroke-width="1" opacity=".6"/></svg>

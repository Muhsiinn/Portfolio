<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>muhsin</title>
  <link href="https://fonts.googleapis.com/css?family=JetBrains Mono" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/4.3.0/marked.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'JetBrains Mono', monospace;
      background: #fff;
      color: #000;
      line-height: 1.7;
      font-size: 14px;
    }

    .container {
      max-width: 850px;
      margin: 0 auto;
      padding: 40px 20px 80px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Header */
    .header {
      text-align: center;
      margin-bottom: 25px;
    }

    .profile-pic {
      width: 100px; height: 100px;
      border-radius: 50%;
      object-fit: cover;
      border: 1px solid #eee;
      filter: grayscale(20%);
      transition: transform .2s ease, filter .3s ease;
      margin-bottom: 12px;
    }
    .profile-pic:hover { transform: scale(1.05); filter: grayscale(0%); }

    .name { font-size: 26px; font-weight: 700; margin-bottom: 6px; }
    .bio { color: #777; font-size: 14px; margin-bottom: 12px; }

    /* Sections */
    section { width: 100%; max-width: 700px; margin-bottom: 45px; }

    h2 {
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 15px;
      border-bottom: 1px solid #eee;
      padding-bottom: 5px;
    }

    p { margin-bottom: 14px; }

    /* Contact directly under header */
    #contact { text-align: center; margin-top: 0; }
    .contact-item { margin-bottom: 8px; }
    .contact-item a { color: #0a58ff; text-decoration: none; }
    .contact-item a:hover { text-decoration: underline; }

    /* Projects */
    .item { border-bottom: 1px solid #eee; padding: 15px 0; }
    .item-title { font-weight: 700; margin-bottom: 6px; }
    .item-desc { color: #555; margin-bottom: 8px; }
    .item-date { color: #aaa; font-size: 12px; margin-bottom: 10px; }
    .item-content { margin-top: 10px; }
    .project-links { margin-top: 8px; }
    .project-links a { color: #0a58ff; text-decoration: none; margin-right: 15px; }
    .project-links a:hover { text-decoration: underline; }
    .tech { color: #999; font-size: 12px; margin-top: 4px; }

    @media (max-width: 768px) {
      .container { padding: 25px 15px; }
      section { max-width: 100%; }
    }
  </style>
</head>
<body>
  <div class="container">

    <header class="header">
      <img id="avatar" class="profile-pic" alt="profile">
      <div class="name" id="site-name">muhsin</div>
      <div class="bio" id="site-bio">loading...</div>
    </header>

    <!-- CONTACT FIRST -->
    <section id="contact">
      <h2>Contact</h2>
      <div id="contact-content">loading...</div>
    </section>

    <section id="about">
      <h2>About</h2>
      <div id="about-content">loading...</div>
    </section>

    <section id="projects">
      <h2>Projects</h2>
      <div id="projects-list">loading...</div>
    </section>

  </div>

  <script>
    let config = {};
    let projects = [];

    async function loadData() {
      try {
        const res = await fetch('data.json');
        if (res.ok) config = await res.json();
        else loadDefaults();
      } catch { loadDefaults(); }

      updateUI();
      loadProjects();
    }

    function loadDefaults() {
      config = {
        name: "muhsin",
        bio: "Student – Artificial Intelligence",
        about: "Currently learning AI and building random projects. Interested in automation, reverse engineering, and making computers do cool stuff.",
        email: "muhsinahmdtk@gmail.com",
        avatar: "images/profile.jpg",
        socials: {
          "github": "https://github.com/Muhsiinn",
          "instagram": "https://www.instagram.com/meowsi.n/",
          "twitter": "https://twitter.com/_Muhsin____"
        }
      };
    }

    function updateUI() {
      document.getElementById('site-name').textContent = config.name || 'muhsin';
      document.getElementById('site-bio').textContent = config.bio || '';
      document.getElementById('about-content').innerHTML = `<p>${config.about || ''}</p>`;
      document.getElementById('avatar').src = config.avatar || 'images/profile.jpg';

      let contactHTML = '';
      if (config.email)
        contactHTML += `<div class="contact-item">email: <a href="mailto:${config.email}">${config.email}</a></div>`;
      if (config.socials)
        Object.entries(config.socials).forEach(([p, url]) =>
          contactHTML += `<div class="contact-item">${p}: <a href="${url}" target="_blank">${url}</a></div>`
        );
      document.getElementById('contact-content').innerHTML = contactHTML;
    }

    async function loadProjects() {
      try {
        const res = await fetch('projects.json');
        if (!res.ok) throw new Error();
        projects = await res.json();
        displayProjects();
      } catch {
        document.getElementById('projects-list').innerHTML = '<div class="error">no projects.json found</div>';
      }
    }

    async function displayProjects() {
      const container = document.getElementById('projects-list');
      container.innerHTML = '';

      for (let i = 0; i < projects.length; i++) {
        const p = projects[i];
        const div = document.createElement('div');
        div.className = 'item';
        div.innerHTML = `
          <div class="item-title">${p.title || 'Untitled'}</div>
          <div class="item-desc">${p.description || ''}</div>
          ${p.date ? `<div class="item-date">${p.date}</div>` : ''}
        `;
        container.appendChild(div);

        let content = '';
        if (p.file) {
          try {
            const resp = await fetch('projects/' + p.file);
            if (resp.ok) content = marked.parse(await resp.text());
            else content = `<p>${p.content || ''}</p>`;
          } catch { content = `<p>${p.content || ''}</p>`; }
        } else if (p.content) content = `<p>${p.content}</p>`;

        if (p.links) {
          content += '<div class="project-links">';
          Object.entries(p.links).forEach(([label, url]) =>
            content += `<a href="${url}" target="_blank">${label}</a>`
          );
          content += '</div>';
        }

        if (p.tech) content += `<div class="tech">${p.tech.join(', ')}</div>`;

        const contentDiv = document.createElement('div');
        contentDiv.className = 'item-content';
        contentDiv.innerHTML = content;
        div.appendChild(contentDiv);
      }
    }

    loadData();
  </script>
</body>
</html>

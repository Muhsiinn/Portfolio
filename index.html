<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>muhsin</title>
    <link href='https://fonts.googleapis.com/css?family=JetBrains Mono' rel='stylesheet'>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/4.3.0/marked.min.js"></script>
    <style>
        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
        }
        
        body {
            font-family: 'JetBrains Mono', monospace;
            background: white;
            color: black;
            line-height: 1.5;
            font-size: 14px;
        }

        /* Hide scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: #ddd;
            border-radius: 3px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #bbb;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            margin-bottom: 40px;
        }

        .name {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .bio {
            color: #666;
            margin-bottom: 20px;
        }

        .nav {
            display: flex;
            gap: 20px;
            margin-bottom: 40px;
        }

        .nav a {
            color: blue;
            text-decoration: none;
            cursor: pointer;
        }

        .nav a:hover, .nav a.active {
            text-decoration: underline;
        }

        .section {
            display: none;
        }

        .section.active {
            display: block;
        }

        .item {
            margin-bottom: 20px;
            padding: 15px 0;
            border-bottom: 1px solid #eee;
        }

        .item-header {
            cursor: pointer;
        }

        .item-title {
            font-weight: bold;
            margin-bottom: 5px;
        }

        .item-desc {
            color: #666;
            margin-bottom: 10px;
        }

        .item-date {
            color: #999;
            font-size: 12px;
            margin-bottom: 10px;
        }

        .item-content {
            display: none;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid #eee;
            line-height: 1.6;
        }

        .item-content.show {
            display: block;
        }

        .item-content img {
            max-width: 100%;
            height: auto;
            margin: 15px 0;
        }

        .item-content p {
            margin-bottom: 15px;
        }

        .item-content h1, .item-content h2, .item-content h3 {
            margin: 20px 0 10px 0;
            font-weight: bold;
        }

        .item-content code {
            background: #f5f5f5;
            padding: 2px 4px;
            font-family: 'JetBrains Mono', monospace;
        }

        .item-content pre {
            background: #f5f5f5;
            padding: 15px;
            overflow-x: auto;
            margin: 15px 0;
        }

        .project-links {
            margin-top: 10px;
        }

        .project-links a {
            color: blue;
            text-decoration: none;
            margin-right: 15px;
        }

        .project-links a:hover {
            text-decoration: underline;
        }

        .tech {
            color: #999;
            font-size: 12px;
            margin-top: 5px;
        }

        .contact-item {
            margin-bottom: 10px;
        }

        .contact-item a {
            color: blue;
            text-decoration: none;
        }

        .contact-item a:hover {
            text-decoration: underline;
        }

        .error {
            color: #999;
            font-style: italic;
        }

        @media (max-width: 768px) {
            .container {
                padding: 15px;
            }
            
            .nav {
                flex-wrap: wrap;
                gap: 15px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="name" id="site-name">muhsin</div>
            <div class="bio" id="site-bio">loading...</div>
        </div>

        <nav class="nav">
            <a href="#" class="active" onclick="showSection('about', this)">about</a>
            <a href="#" onclick="showSection('projects', this)">projects</a>
            <a href="#" onclick="showSection('blog', this)">blog</a>
            <a href="#" onclick="showSection('contact', this)">contact</a>
        </nav>

        <section id="about" class="section active">
            <div id="about-content">loading...</div>
        </section>

        <section id="projects" class="section">
            <div id="projects-list">loading...</div>
        </section>

        <section id="blog" class="section">
            <div id="blog-list">loading...</div>
        </section>

        <section id="contact" class="section">
            <div id="contact-content">loading...</div>
        </section>
    </div>

    <script>
        let config = {};
        let projects = [];
        let blogPosts = [];

        async function loadData() {
            try {
                const response = await fetch('data.json');
                if (response.ok) {
                    config = await response.json();
                    updateUI();
                } else {
                    loadDefaults();
                }
            } catch (error) {
                loadDefaults();
            }
            
            loadProjects();
            loadBlog();
        }

        function loadDefaults() {
            config = {
                name: "muhsin",
                bio: "i build things",
                about: "currently learning AI and building random projects. interested in automation, reverse engineering, and making computers do cool stuff.",
                email: "muhsinahmdtk@gmail.com",
                socials: {
                    "github": "https://github.com/Muhsiinn",
                    "instagram": "https://www.instagram.com/meowsi.n/",
                    "twitter": "https://twitter.com/_Muhsin____"
                }
            };
            updateUI();
        }

        function updateUI() {
            document.getElementById('site-name').textContent = config.name;
            document.getElementById('site-bio').textContent = config.bio;
            document.getElementById('about-content').innerHTML = `<p>${config.about}</p>`;
            
            // Contact
            let contactHTML = `<div class="contact-item">email: <a href="mailto:${config.email}">${config.email}</a></div>`;
            if (config.socials) {
                Object.entries(config.socials).forEach(([platform, url]) => {
                    contactHTML += `<div class="contact-item">${platform}: <a href="${url}">${url}</a></div>`;
                });
            }
            document.getElementById('contact-content').innerHTML = contactHTML;
        }

        async function loadProjects() {
            try {
                const response = await fetch('projects.json');
                if (response.ok) {
                    projects = await response.json();
                    displayProjects();
                } else {
                    document.getElementById('projects-list').innerHTML = '<div class="error">no projects.json found</div>';
                }
            } catch (error) {
                document.getElementById('projects-list').innerHTML = '<div class="error">no projects.json found</div>';
            }
        }

        async function displayProjects() {
            const container = document.getElementById('projects-list');
            container.innerHTML = '';
            
            for (let i = 0; i < projects.length; i++) {
                const project = projects[i];
                
                const itemDiv = document.createElement('div');
                itemDiv.className = 'item';
                itemDiv.innerHTML = `
                    <div class="item-header" onclick="toggle(${i}, 'project')">
                        <div class="item-title">${project.title}</div>
                        <div class="item-desc">${project.description}</div>
                    </div>
                    <div class="item-content" id="project-${i}">
                        Loading...
                    </div>
                `;
                
                container.appendChild(itemDiv);
                
                // Load content
                const contentDiv = document.getElementById(`project-${i}`);
                let content = '';
                
                if (project.file) {
                    try {
                        const response = await fetch(`projects/${project.file}`);
                        if (response.ok) {
                            const markdown = await response.text();
                            content = marked.parse(markdown);
                        } else {
                            content = `<p>${project.content || 'File not found'}</p>`;
                        }
                    } catch (error) {
                        content = `<p>${project.content || 'Error loading file'}</p>`;
                    }
                } else if (project.content) {
                    content = `<p>${project.content}</p>`;
                } else {
                    content = '<p>No content</p>';
                }
                
                if (project.links) {
                    content += '<div class="project-links">';
                    Object.entries(project.links).forEach(([label, url]) => {
                        content += `<a href="${url}" target="_blank">${label}</a>`;
                    });
                    content += '</div>';
                }
                
                if (project.tech) {
                    content += `<div class="tech">${project.tech.join(', ')}</div>`;
                }
                
                contentDiv.innerHTML = content;
            }
        }

        async function loadBlog() {
            try {
                const response = await fetch('blog.json');
                if (response.ok) {
                    blogPosts = await response.json();
                    displayBlog();
                } else {
                    document.getElementById('blog-list').innerHTML = '<div class="error">no blog.json found</div>';
                }
            } catch (error) {
                document.getElementById('blog-list').innerHTML = '<div class="error">no blog.json found</div>';
            }
        }

        async function displayBlog() {
            const container = document.getElementById('blog-list');
            container.innerHTML = '';
            
            for (let i = 0; i < blogPosts.length; i++) {
                const post = blogPosts[i];
                
                const itemDiv = document.createElement('div');
                itemDiv.className = 'item';
                itemDiv.innerHTML = `
                    <div class="item-header" onclick="toggle(${i}, 'blog')">
                        <div class="item-title">${post.title}</div>
                        <div class="item-date">${post.date}</div>
                    </div>
                    <div class="item-content" id="blog-${i}">
                        Loading...
                    </div>
                `;
                
                container.appendChild(itemDiv);
                
                // Load content
                const contentDiv = document.getElementById(`blog-${i}`);
                let content = '';
                
                if (post.file) {
                    try {
                        const response = await fetch(`blog/${post.file}`);
                        if (response.ok) {
                            const markdown = await response.text();
                            content = marked.parse(markdown);
                        } else {
                            content = `<p>${post.content || 'File not found'}</p>`;
                        }
                    } catch (error) {
                        content = `<p>${post.content || 'Error loading file'}</p>`;
                    }
                } else {
                    content = `<p>${post.content}</p>`;
                }
                
                contentDiv.innerHTML = content;
            }
        }

        function toggle(index, type) {
            const contentDiv = document.getElementById(`${type}-${index}`);
            
            if (contentDiv.classList.contains('show')) {
                contentDiv.classList.remove('show');
            } else {
                contentDiv.classList.add('show');
            }
        }

        function showSection(section, element) {
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.nav a').forEach(a => a.classList.remove('active'));
            
            document.getElementById(section).classList.add('active');
            element.classList.add('active');
        }

        // Initialize
        loadData();
    </script>
</body>
</html>

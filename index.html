<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>muhsin</title>
  <link href="https://fonts.googleapis.com/css?family=JetBrains Mono" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/4.3.0/marked.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    /* ===== Scrollbar Hidden / Minimal ===== */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb {
      background: rgba(0,0,0,0.15);
      border-radius: 3px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(0,0,0,0.25);
    }

    html, body {
      overflow-y: scroll;
      scrollbar-width: thin;
      scrollbar-color: transparent transparent;
    }

    body {
      font-family: 'JetBrains Mono', monospace;
      background: #fff;
      color: #000;
      line-height: 1.6;
      font-size: 14px;
    }

    .container {
      max-width: 850px;
      margin: 0 auto;
      padding: 40px 20px 60px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* ===== Header ===== */
    .header {
      text-align: center;
      margin-bottom: 35px;
    }

    .profile-pic {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      object-fit: cover;
      border: 1px solid #ccc;
      margin-bottom: 10px;
    }

    .name {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 5px;
    }

    .bio {
      color: #555;
      font-size: 13px;
      margin-bottom: 10px;
    }

    /* ===== Sections ===== */
    section {
      width: 100%;
      max-width: 700px;
      margin-bottom: 35px;
    }

    h2 {
      font-size: 14px;
      text-transform: uppercase;
      border-bottom: 1px solid #eee;
      margin-bottom: 10px;
      padding-bottom: 3px;
      color: #222;
      letter-spacing: 0.5px;
    }

    p { margin-bottom: 10px; color: #222; }

    /* ===== Contact ===== */
    #contact { text-align: center; }
    .contact-item { margin-bottom: 6px; }
    .contact-item a { color: #0a58ff; text-decoration: none; }

    /* ===== Education / Side Quests ===== */
    .edu-entry, .side-entry {
      margin-bottom: 10px;
      padding-left: 6px;
      border-left: 1px solid #eee;
    }

    /* ===== Projects (Pure Accordion) ===== */
    .item {
      border-top: 1px solid #eee;
      padding-top: 12px;
      padding-bottom: 8px;
    }

    .item-header {
      cursor: pointer;
      font-weight: 600;
      font-size: 14px;
      color: #111;
      padding-left: 4px;
    }

    .item-header.active {
      color: #000;
    }

    .item-desc {
      padding: 4px 0 6px 6px;
      color: #555;
      font-size: 13px;
    }

    .item-content {
      display: none;
      padding-left: 10px;
      border-left: 1px dashed #ddd;
      margin-top: 4px;
    }

    .item-content.show { display: block; }

    .item-content p { margin: 8px 0; color: #333; }
    .item-content a { color: #0a58ff; text-decoration: none; }
    .item-content a:hover { text-decoration: underline; }

    @media (max-width: 768px) {
      .container { padding: 25px 15px; }
      section { max-width: 100%; }
    }
  </style>
</head>
<body>
  <div class="container">

    <!-- HEADER -->
    <header class="header">
      <img id="avatar" class="profile-pic" alt="profile picture">
      <div id="site-name" class="name">muhsin</div>
      <div id="site-bio" class="bio">loading...</div>
    </header>

    <!-- ABOUT -->
    <section id="about">
      <h2>About</h2>
      <div id="about-content">loading...</div>
    </section>

    <!-- CONTACT -->
    <section id="contact">
      <h2>Contact</h2>
      <div id="contact-content">loading...</div>
    </section>

    <!-- EDUCATION -->
    <section id="education">
      <h2>Education</h2>
      <div id="education-list">loading...</div>
    </section>

    <!-- PROJECTS -->
    <section id="projects">
      <h2>Projects</h2>
      <div id="projects-list">loading...</div>
    </section>

  </div>

  <script>
    let config = {}, education = {}, projects = [];

    async function loadData() {
      try {
        const [dataRes, eduRes, projRes] = await Promise.all([
          fetch('data.json'),
          fetch('education.json'),
          fetch('projects.json')
        ]);
        config = await dataRes.json();
        education = await eduRes.json();
        projects = await projRes.json();
      } catch (error) {
        console.error("Error loading data:", error);
      }
      updateUI();
    }

    function updateUI() {
      // Profile
      document.getElementById('site-name').textContent = config.name || 'muhsin';
      document.getElementById('site-bio').textContent = config.bio || '';
      document.getElementById('avatar').src = config.avatar || 'images/profile.jpg';

      // About
      document.getElementById('about-content').innerHTML = `<p>${config.about || ''}</p>`;

      // Contact
      let contactHTML = '';
      if (config.email)
        contactHTML += `<div class="contact-item">email: <a href="mailto:${config.email}">${config.email}</a></div>`;
      if (config.socials)
        Object.entries(config.socials).forEach(([p, url]) =>
          contactHTML += `<div class="contact-item">${p}: <a href="${url}" target="_blank">${url}</a></div>`
        );
      document.getElementById('contact-content').innerHTML = contactHTML || '—';

      // Education
      let eduHTML = '';
      if (education.formal) {
        education.formal.forEach(e => {
          eduHTML += `<div class="edu-entry"><strong>${e.degree}</strong>, ${e.institution} (${e.start}–${e.end})<br>${e.location || ''}</div>`;
        });
      }
      if (education.side_quests) {
        eduHTML += `<h3 style="margin-top:15px;font-size:13px;color:#333;">Side Quests</h3>`;
        education.side_quests.forEach(s => {
          eduHTML += `<div class="side-entry"><strong>${s.title}</strong> — ${s.organizer}<br>${s.focus || ''}</div>`;
        });
      }
      document.getElementById('education-list').innerHTML = eduHTML || '—';

      // Projects
      displayProjects();
    }

    async function displayProjects() {
      const container = document.getElementById('projects-list');
      container.innerHTML = '';

      for (let i = 0; i < projects.length; i++) {
        const p = projects[i];
        const div = document.createElement('div');
        div.className = 'item';
        div.innerHTML = `
          <div class="item-header" onclick="toggleProject(this, ${i})">${p.title || 'Untitled'}</div>
          <div class="item-desc">${p.description || ''}</div>
          <div class="item-content" id="project-${i}">
            <p style="color:#777;">Loading content...</p>
          </div>`;
        container.appendChild(div);

        // Markdown
        if (p.file) {
          try {
            const res = await fetch('projects/' + p.file);
            if (res.ok) {
              const md = await res.text();
              const html = marked.parse(md);
              const links = p.links
                ? Object.entries(p.links)
                    .map(([label, url]) => `<p><a href="${url}" target="_blank">${label}</a></p>`)
                    .join('')
                : '';
              document.getElementById('project-' + i).innerHTML = html + links;
            } else {
              document.getElementById('project-' + i).innerHTML = `<p>Missing file: ${p.file}</p>`;
            }
          } catch {
            document.getElementById('project-' + i).innerHTML = `<p>Error loading ${p.file}</p>`;
          }
        }
      }
    }

    function toggleProject(header, index) {
      const content = document.getElementById('project-' + index);
      const isOpen = content.classList.contains('show');
      content.classList.toggle('show', !isOpen);
      header.classList.toggle('active', !isOpen);
    }

    loadData();
  </script>
</body>
</html>
